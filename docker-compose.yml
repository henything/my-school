services:
  postgres:
    image: postgres:16-alpine
    container_name: my-school-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: my_school
      POSTGRES_PASSWORD: my_school_dev_password
      POSTGRES_DB: my_school_dev
    ports:
      - "5432:5432"
    volumes:
      - my_school_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_school -d my_school_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  my_school_postgres_data:
